[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-agent"
version = "0.1.0"
description = "轻量本地论文辅助 CLI Agent，支持模型流式输出与论文检索"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "huggingface-hub>=0.34,<1",
    "langchain>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.4,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langchain-text-splitters>=0.3,<2",
    "jieba>=0.42,<1",
    "pypdf>=5,<7",
    "fonttools>=4,<5",
    "mcp>=1.9,<2",
    "pydantic-settings>=2.8,<3",
    "pysqlite3-binary>=0.5,<1",
    "torch==2.8.0",
    "transformers==4.56.2",
    "typer>=0.15,<1",
    "vllm==0.10.2",
]

[project.optional-dependencies]
rag = ["chromadb>=1,<2", "langchain-chroma>=0.2,<2", "langchain-huggingface>=0.2,<2", "sentence-transformers>=4,<6"]
dev = ["mypy>=1.15,<2", "pytest>=8,<9", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
local-agent = "local_agent.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
